version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR per ecosystem keeps the noise down and the lockfile consistent.
      dev-tooling:
        patterns:
          - '@types/*'
          - 'eslint*'
          - 'prettier'
          - 'typescript'
          - 'vitest'
          - '@vitejs/*'
      runtime:
        patterns:
          - '*'
        exclude-patterns:
          - '@types/*'
          - 'eslint*'
          - 'prettier'
          - 'typescript'
          - 'vitest'
          - '@vitejs/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
