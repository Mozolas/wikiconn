# Production stack. Deployed to the server by .github/workflows/deploy.yml,
# which writes the accompanying .env with the image tags to run.
# HTTPS is terminated by the shared `edge` Caddy on the server (defined in Mozolas/vibek,
# deploy/edge/); web and api join its external network under wikiconn-prefixed aliases.
name: wikiconn

services:
  web:
    image: ${WEB_IMAGE:?set WEB_IMAGE}
    restart: unless-stopped
    environment:
      NODE_ENV: production
    expose:
      - '3000'
    networks:
      default:
      edge:
        aliases: [wikiconn-web]

  api:
    image: ${API_IMAGE:?set API_IMAGE}
    restart: unless-stopped
    environment:
      PORT: '3001'
      REDIS_URL: redis://dragonfly:6379
      CORS_ORIGIN: https://${WIKICONN_DOMAIN}
      # The edge Caddy is the only hop in front of this container.
      TRUST_PROXY_HOPS: '1'
      WIKI_SEARCH_CACHE_TTL_SECONDS: '300'
      # Wikimedia's policy asks automated clients to identify themselves and to
      # provide a way of reaching the operator.
      WIKI_USER_AGENT: WikiConn/1.0 (https://${WIKICONN_DOMAIN}; https://github.com/Mozolas/wikiconn)
      LOG_LEVEL: log
    expose:
      - '3001'
    networks:
      default:
      edge:
        aliases: [wikiconn-api]
    depends_on:
      dragonfly:
        condition: service_healthy

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    restart: unless-stopped
    ulimits:
      memlock: -1
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - dragonfly-data:/data

networks:
  edge:
    external: true

volumes:
  dragonfly-data:
